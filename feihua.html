<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>飞花令 - 古风诗词对决</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

        :root {
            --paper-bg: #f5eedc;
            --ink-dark: #2c2e2f;
            --ink-light: #5a5c5d;
            --seal-red: #a33131;
        }

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background-color: #e8e2d2;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: var(--ink-dark);
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 0),
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .paper-container {
            background-color: var(--paper-bg);
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .ancient-border {
            border: 2px solid var(--ink-dark);
            padding: 4px;
            position: relative;
        }
        .ancient-border::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--ink-light);
        }

        .seal-stamp {
            color: var(--seal-red);
            border: 2px solid var(--seal-red);
            border-radius: 4px;
            padding: 2px 6px;
            font-weight: 900;
            display: inline-block;
            transform: rotate(-5deg);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(44, 46, 47, 0.2); border-radius: 10px; }

        @keyframes fadeInRise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-bubble { animation: fadeInRise 0.4s ease-out forwards; }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* 手机端适配 */
        @media (max-width: 640px) {
            body {
                padding-top: 50px;
                height: auto;
                min-height: 100vh;
            }

            .paper-container {
                height: calc(100vh - 60px) !important;
            }

            .fixed.top-4 {
                top: 10px;
                left: auto;
                right: 10px;
                transform: none;
                padding: 8px 14px;
                font-size: 12px;
            }

            .fixed.top-4 svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen">

    <!-- 返回首页按钮 -->
    <a href="index.html" class="fixed top-4 left-4 z-50 bg-[#2c2e2f] hover:bg-[#1a1a1a] text-[#f5eedc] px-4 py-2 rounded-lg font-bold transition-all flex items-center gap-2 shadow-lg">

        <!-- 游戏界面 -->
        <div id="screen-game" class="flex flex-col h-full w-full absolute inset-0 opacity-0 pointer-events-none transition-opacity duration-500 z-20 bg-[var(--paper-bg)]">

                </div>

                </div>
            </div>

        </div>

            '酒': [

                "浊酒一杯家万里，燕然未勒归无计", "醉翁之意不在酒，在乎山水之间也", "酒入愁肠，化作相思泪",
                "兰陵美酒郁金香，玉碗盛来琥珀光", "莫笑农家腊酒浑，丰年留客足鸡豚", "中军置酒饮归客，胡琴琵琶与羌笛",
                "春江花朝秋月夜，往往取酒还独倾", "一壶酒，一竿纶，世上如侬有几人", "酒债寻常行处有，人生七十古来稀",
                "抽刀断水水更流，举杯消愁愁更愁", "三杯两盏淡酒，怎敌他晚来风急", "把酒祝东风，且共从容",
                "一曲新词酒一杯，去年天气旧亭台", "东篱把酒黄昏后，有暗香盈袖", "酒酣胸胆尚开张",
                "酒醒只在花前坐，酒醉还来花下眠", "酒逢知己千杯少，话不投机半句多", "酒阑更喜团茶苦，梦断偏宜瑞脑香",
                "酒美梅酸，恰称人怀抱", "酒意诗情谁与共，泪融残粉花钿重", "酒徒一半，独去作江边渔父",
                "酒困路长惟欲睡，日高人渴漫思茶", "酒未开樽句未裁，寻春问腊到蓬莱", "酒醒人静，月满楼台",
                "酒市冷闲人散后，月明桥上独吹箫", "酒薄不堪饮，情深不可量", "酒暖回忆，茶凉言尽"
            ],
            '梦': [
                "夜阑卧听风吹雨，铁马冰河入梦来", "庄生晓梦迷蝴蝶，望帝春心托杜鹃", "梦里不知身是客，一晌贪欢",
                "十年一觉扬州梦，赢得青楼薄幸名", "自在飞花轻似梦，无边丝雨细如愁", "夜深忽梦少年事，梦啼妆泪红阑干",
                "梦后楼台高锁，酒醒帘幕低垂", "世事一场大梦，人生几度秋凉", "梦里花落知多少",
                "梦入神山教神妪，老鱼跳波瘦蛟舞", "梦绕边城月，心飞故国楼", "梦觉春衾，江南依旧远",
                "梦魂惯得无拘检，又踏杨花过谢桥", "梦中未比丹青见，暗里忽惊山鸟啼", "梦断香消四十年，沈园柳老不吹绵",
                "梦回莺转，乱煞年光遍", "梦觉透窗风一线，寒灯流旧焰", "梦随风万里，寻郎去处",
                "梦为远别啼难唤，书被催成墨未浓", "梦好难留，诗残莫续", "梦长君不知，梦短情难尽",
                "梦里依稀慈母泪，城头变幻大王旗", "梦入江南烟水路，行尽江南，不与离人遇",
                "梦回芳草夜，歌罢落梅天", "梦觉尚心寒", "梦断彩云无觅处，夜凉明月升天去",
                "梦觉秋宵，起看星斗正阑干", "梦怕愁时断，春凭暖处回", "梦入蓝桥，几点疏星映朱户",
                "梦冷黄金屋，叹秦筝、斜鸿阵里，素弦尘扑", "梦断香消四十年", "梦绕云山心似鹿，魂惊汤火命如鸡"
            ]
        };

        const screens = {
            start: document.getElementById('screen-start'),
            game: document.getElementById('screen-game'),
            result: document.getElementById('screen-result')
        };
        const chatBox = document.getElementById('chat-box');
        const playerInput = document.getElementById('player-input');
        const submitBtn = document.getElementById('submit-btn');
        const timerDisplay = document.getElementById('timer-display');
        const currentKeywordEl = document.getElementById('current-keyword');
        const toastEl = document.getElementById('toast');

        let currentKeyword = '';
        let usedPoems = new Set(); // 存储被使用的"原句(无标点)"
        let rounds = 0;
        let timer = null;
        let timeLeft = 120;
        let isPlayerTurn = false;

        // 去除标点用于比对
        function stripPunctuation(str) {
            return str.replace(/[，。！？、；：""''（）《》〈〉【】\s]/g, "");
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(el => {
                el.classList.remove('z-20');
                el.classList.add('opacity-0', 'pointer-events-none');
            });
            screens[screenName].classList.remove('opacity-0', 'pointer-events-none');
            screens[screenName].classList.add('z-20');
        }

        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.remove('opacity-0');
            setTimeout(() => { toastEl.classList.add('opacity-0'); }, 2500);
        }

        function renderMessage(text, isAI) {
            const wrapper = document.createElement('div');
            wrapper.className = `msg-bubble flex w-full ${isAI ? 'justify-start' : 'justify-end'}`;
            
            const bubble = document.createElement('div');
            if (isAI) {
                bubble.className = "max-w-[85%] bg-[var(--ink-dark)] text-[var(--paper-bg)] px-4 py-3 rounded-tr-xl rounded-br-xl rounded-bl-xl shadow-md border-l-4 border-[var(--ink-light)] text-lg leading-relaxed relative";
            } else {
                bubble.className = "max-w-[85%] bg-[var(--paper-bg)] border-2 border-[var(--seal-red)] text-[var(--ink-dark)] px-4 py-3 rounded-tl-xl rounded-bl-xl rounded-br-xl shadow-md text-lg leading-relaxed relative";
            }

            const regex = new RegExp(currentKeyword, 'g');
            const highlightedText = text.replace(regex, `<span class="${isAI ? 'text-[var(--seal-red)]' : 'text-[var(--seal-red)] font-bold'}">${currentKeyword}</span>`);
            
            if(isAI) {
                 bubble.innerHTML = `<span class="absolute -top-4 left-0 text-xs text-[var(--ink-light)] font-bold">墨客</span>${highlightedText}`;
            } else {
                 bubble.innerHTML = `<span class="absolute -top-4 right-0 text-xs text-[var(--seal-red)] font-bold">阁下</span>${highlightedText}`;
            }

            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderSystemMsg(text) {
            const wrapper = document.createElement('div');
            wrapper.className = "msg-bubble flex w-full justify-center my-2";
            wrapper.innerHTML = `<div class="text-xs text-[var(--ink-light)] bg-black/5 px-3 py-1 rounded-full">${text}</div>`;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 120; // 考虑玩家需要打字，放宽至120秒
            timerDisplay.innerText = timeLeft;
            timerDisplay.style.color = "var(--ink-dark)";
            
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 5) timerDisplay.style.color = "var(--seal-red)";
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endGame(false, "超时未作答，遗憾落败。");
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
        }

        function aiTurn() {
            isPlayerTurn = false;
            stopTimer();
            timerDisplay.innerText = "对方";
            
            renderSystemMsg("墨客正在思索中...");

            setTimeout(() => {
                const availablePoems = poetryDB[currentKeyword].filter(p => {
                    const cleanP = stripPunctuation(p);
                    for(let used of usedPoems) {
                        // 如果原诗与已用过的诗句重合，不可再用
                        if (used.includes(cleanP) || cleanP.includes(used)) return false;
                    }
                    return true;
                });

                chatBox.removeChild(chatBox.lastChild); 

                if (availablePoems.length === 0) {
                    endGame(true, "对方江郎才尽，阁下大获全胜！");
                } else {
                    const picked = availablePoems[Math.floor(Math.random() * availablePoems.length)];
                    usedPoems.add(stripPunctuation(picked));
                    
                    // AI 回答时展示半句还是全句随机，增加真实感
                    let showText = picked;
                    if(picked.includes('，') && Math.random() > 0.5) {
                         const parts = picked.split(/[，。]/).filter(s => s.includes(currentKeyword));
                         if(parts.length > 0) showText = parts[0];
                    }

                    renderMessage(showText, true);
                    rounds++;
                    
                    isPlayerTurn = true;
                    playerInput.disabled = false;
                    playerInput.focus();
                    startTimer();
                }
            }, 1500 + Math.random() * 1000);
        }

        function handlePlayerSubmit() {
            if (!isPlayerTurn) return;
            
            let text = playerInput.value.trim();
            if (!text) return;

            // 1. 包含关键字
            if (!text.includes(currentKeyword)) {
                showToast(`必须包含关键字「${currentKeyword}」`);
                return;
            }

            const cleanText = stripPunctuation(text);
            if (cleanText.length < 3) {
                showToast("诗句过短，请查证");
                return;
            }

            // 2. 数据库校验防乱编
            let isValidPoem = false;
            let matchedDBPoem = ""; 
            for (let p of poetryDB[currentKeyword]) {
                const cleanDBText = stripPunctuation(p);
                // 允许玩家输入整首诗的半句，或带标点的全句
                if (cleanDBText.includes(cleanText) || cleanText.includes(cleanDBText)) {
                    isValidPoem = true;
                    matchedDBPoem = cleanDBText; // 记录对应的完整原句，防重复
                    break;
                }
            }

            if (!isValidPoem) {
                showToast("未收录该诗或非古诗词，请换一句");
                return;
            }

            // 3. 查重 (检查刚才记录的完整原句是否已经被使用过)
            let isUsed = false;
            for(let used of usedPoems) {
                if (used === matchedDBPoem || used.includes(cleanText) || cleanText.includes(used)) {
                    isUsed = true; break;
                }
            }
            if (isUsed) {
                showToast("这首诗刚才已经用过啦，请换一首");
                return;
            }

            // 验证通过
            stopTimer();
            usedPoems.add(matchedDBPoem); // 将匹配到的完整原句加入已使用库
            renderMessage(text, false);
            playerInput.value = '';
            playerInput.disabled = true;
            
            aiTurn();
        }

        function startGame(keyword) {
            currentKeyword = keyword;
            currentKeywordEl.innerText = keyword;
            usedPoems.clear();
            rounds = 0;
            chatBox.innerHTML = '';
            playerInput.value = '';
            
            showScreen('game');
            renderSystemMsg(`飞花令始，今日考题为「${keyword}」字`);
            
            setTimeout(() => { aiTurn(); }, 800);
        }

        function endGame(playerWon, reason) {
            stopTimer();
            showScreen('result');
            
            document.getElementById('result-title').innerText = playerWon ? "大获全胜" : "遗憾落败";
            document.getElementById('result-title').style.color = playerWon ? "var(--seal-red)" : "var(--ink-light)";
            
            document.getElementById('result-desc').innerHTML = `${reason}<br>共历经 <span class="text-[var(--seal-red)] font-bold text-xl">${rounds}</span> 轮交锋。`;
        }

        function resetGame() {
            showScreen('start');
        }

        submitBtn.addEventListener('click', handlePlayerSubmit);
        playerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handlePlayerSubmit();
        });
        
        playerInput.addEventListener('focus', () => {
            setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 300);
        });

        // 主题初始化
        function getThemeFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('theme');
        }
        const urlTheme = getThemeFromURL();
        const savedTheme = urlTheme || localStorage.getItem('game-theme') || 'cyberpunk';
        // 飞花令保持古典风格，但应用主题色调
        if (savedTheme === 'modern-minimalist' || savedTheme === 'arctic-frost') {
            document.body.style.backgroundColor = '#f0f0f0';
        }

    </script>
