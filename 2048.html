<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 // CYBERPUNK EDITION</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================
   BASE VARIABLES & RESET
   ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

[data-theme="cyberpunk"] {
  --bg: #0a0a0f;
  --bg-panel: rgba(13, 13, 20, 0.95);
  --primary: #00fff0;
  --secondary: #ff00ff;
  --accent: #fcee0a;
  --text: #e0e0e0;
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --panel-border: 1px solid rgba(0, 255, 240, 0.3);
  --shadow: 0 0 30px rgba(0, 255, 240, 0.1);
  --grid-bg: #151520;
  --tile-bg: rgba(255, 255, 255, 0.05);
}

body {
  font-family: var(--font-mono);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text);
  overflow: hidden;
}

.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
  background: var(--bg-panel);
  border: var(--panel-border);
  padding: 10px 16px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(10px);
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

h1 {
  font-family: var(--font-display);
  font-size: 48px;
  color: var(--primary);
  text-shadow: 0 0 10px var(--primary);
  letter-spacing: 4px;
}

.score-container {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}

.score-box {
  background: var(--bg-panel);
  border: var(--panel-border);
  padding: 10px 20px;
  min-width: 100px;
  text-align: center;
}

.score-label {
  font-size: 12px;
  color: var(--primary);
  opacity: 0.7;
}

.score-value {
  font-size: 24px;
  font-weight: 700;
}

/* Game Board */
.game-container {
  position: relative;
  width: min(400px, 90vw);
  height: min(400px, 90vw);
  background: var(--grid-bg);
  border: 4px solid var(--bg-panel);
  padding: 15px;
  border-radius: 6px;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
  height: 100%;
}

.grid-cell {
  background: var(--tile-bg);
  border-radius: 4px;
}

.tile-container {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  bottom: 15px;
  pointer-events: none;
}

.tile {
  position: absolute;
  width: calc((100% - 30px) / 4);
  height: calc((100% - 30px) / 4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: min(32px, 8vw);
  font-weight: 900;
  font-family: var(--font-display);
  border-radius: 4px;
  transition: transform 150ms ease-in-out, background 100ms;
  z-index: 10;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

/* Tile Colors */
.tile-2 { background: #eee; color: #333; }
.tile-4 { background: #ede0c8; color: #333; }
.tile-8 { background: #f2b179; color: #fff; box-shadow: 0 0 10px #f2b179; }
.tile-16 { background: #f59563; color: #fff; box-shadow: 0 0 10px #f59563; }
.tile-32 { background: #f67c5f; color: #fff; box-shadow: 0 0 15px #f67c5f; }
.tile-64 { background: #f65e3b; color: #fff; box-shadow: 0 0 15px #f65e3b; }
.tile-128 { background: #edcf72; color: #fff; font-size: 28px; box-shadow: 0 0 20px #edcf72; }
.tile-256 { background: #edcc61; color: #fff; font-size: 28px; box-shadow: 0 0 20px #edcc61; }
.tile-512 { background: #edc850; color: #fff; font-size: 24px; box-shadow: 0 0 25px #edc850; }
.tile-1024 { background: #edc53f; color: #fff; font-size: 20px; box-shadow: 0 0 25px #edc53f; }
.tile-2048 { background: var(--primary); color: var(--bg); font-size: 20px; box-shadow: 0 0 30px var(--primary); }

.tile-new { animation: appear 200ms ease-out; }
.tile-merged { animation: pop 200ms ease-in-out; }

@keyframes appear {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.controls {
  margin-top: 30px;
  display: flex;
  gap: 20px;
}

.btn {
  padding: 12px 24px;
  background: var(--bg-panel);
  border: var(--panel-border);
  color: var(--primary);
  font-family: var(--font-mono);
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 2px;
}

.btn:hover {
  background: var(--primary);
  color: var(--bg);
}

</style>
</head>
<body data-theme="cyberpunk">

<a href="index.html" class="back-btn">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  <span>返回</span>
</a>

<div class="header">
  <h1>2048</h1>
  <div class="score-container">
    <div class="score-box">
      <div class="score-label">SCORE</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">BEST</div>
      <div class="score-value" id="bestScore">0</div>
    </div>
  </div>
</div>

<div class="game-container">
  <div class="grid-container">
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
  </div>
  <div class="tile-container" id="tileContainer"></div>
</div>

<div class="controls">
  <button class="btn" id="btnNew">NEW GAME</button>
</div>

<script>
// SoundEngine copy (will move to separate file if possible, for now inline)
class SoundEngine {
  constructor() {
    this.enabled = true;
    this.ctx = null;
  }
  _ensureCtx() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, duration, type = 'sine', gainVal = 0.2) {
    if (!this.enabled) return;
    this._ensureCtx();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  }
  playMove() { this.playTone(400, 0.08, 'sine', 0.1); }
  playMerge() { this.playTone(800, 0.1, 'sine', 0.2); }
}

const sound = new SoundEngine();

class Game2048 {
  constructor() {
    this.grid = Array(16).fill(null);
    this.score = 0;
    this.bestScore = parseInt(localStorage.getItem('2048-best')) || 0;
    this.init();
  }

  init() {
    this.grid.fill(null);
    this.score = 0;
    this.addRandomTile();
    this.addRandomTile();
  }

  addRandomTile() {
    const emptyCells = this.grid.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
    if (emptyCells.length > 0) {
      const idx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      this.grid[idx] = Math.random() < 0.9 ? 2 : 4;
      return idx;
    }
    return null;
  }

  move(direction) {
    // 0: up, 1: right, 2: down, 3: left
    let moved = false;
    const size = 4;

    const getCoord = (idx) => [Math.floor(idx / size), idx % size];
    const getIndex = (r, c) => r * size + c;

    const traverse = (r, c, dr, dc) => {
      let currentR = r;
      let currentC = c;
      while (true) {
        const nextR = currentR + dr;
        const nextC = currentC + dc;
        if (nextR < 0 || nextR >= size || nextC < 0 || nextC >= size) break;
        if (this.grid[getIndex(nextR, nextC)] !== null) break;
        currentR = nextR;
        currentC = nextC;
      }
      return [currentR, currentC];
    };

    // Determine traversal order
    const rows = direction === 2 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const cols = direction === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    
    const dr = [-1, 0, 1, 0][direction];
    const dc = [0, 1, 0, -1][direction];

    const merged = Array(16).fill(false);

    for (const r of rows) {
      for (const c of cols) {
        const idx = getIndex(r, c);
        const val = this.grid[idx];
        if (val === null) continue;

        const [nextR, nextC] = traverse(r, c, dr, dc);
        const nextIdx = getIndex(nextR, nextC);
        
        // Potential merge
        const fartherR = nextR + dr;
        const fartherC = nextC + dc;
        if (fartherR >= 0 && fartherR < size && fartherC >= 0 && fartherC < size) {
          const fartherIdx = getIndex(fartherR, fartherC);
          if (this.grid[fartherIdx] === val && !merged[fartherIdx]) {
            this.grid[fartherIdx] *= 2;
            this.grid[idx] = null;
            this.score += this.grid[fartherIdx];
            merged[fartherIdx] = true;
            moved = true;
            continue;
          }
        }

        if (nextIdx !== idx) {
          this.grid[nextIdx] = val;
          this.grid[idx] = null;
          moved = true;
        }
      }
    }

    if (moved) {
      this.addRandomTile();
      if (this.score > this.bestScore) {
        this.bestScore = this.score;
        localStorage.setItem('2048-best', this.bestScore);
      }
    }
    return moved;
  }
}

const game = new Game2048();
const tileContainer = document.getElementById('tileContainer');

function render() {
  document.getElementById('score').textContent = game.score;
  document.getElementById('bestScore').textContent = game.bestScore;

  tileContainer.innerHTML = '';
  game.grid.forEach((val, idx) => {
    if (val !== null) {
      const r = Math.floor(idx / 4);
      const c = idx % 4;
      const tile = document.createElement('div');
      tile.className = `tile tile-${val}`;
      // Calculate position with gaps (10px gap)
      tile.style.transform = `translate(calc(${c * 100}% + ${c * 10}px), calc(${r * 100}% + ${r * 10}px))`;
      tile.textContent = val;
      tileContainer.appendChild(tile);
    }
  });
}

document.getElementById('btnNew').addEventListener('click', () => {
  game.init();
  render();
});

document.addEventListener('keydown', (e) => {
  let direction = -1;
  if (e.key === 'ArrowUp' || e.key === 'w') direction = 0;
  if (e.key === 'ArrowRight' || e.key === 'd') direction = 1;
  if (e.key === 'ArrowDown' || e.key === 's') direction = 2;
  if (e.key === 'ArrowLeft' || e.key === 'a') direction = 3;

  if (direction !== -1) {
    e.preventDefault();
    if (game.move(direction)) {
      sound.playMove();
      render();
    }
  }
});

// Touch controls
let touchStartClientX, touchStartClientY;
document.addEventListener('touchstart', (e) => {
  touchStartClientX = e.touches[0].clientX;
  touchStartClientY = e.touches[0].clientY;
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (!touchStartClientX || !touchStartClientY) return;

  const dx = e.changedTouches[0].clientX - touchStartClientX;
  const dy = e.changedTouches[0].clientY - touchStartClientY;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  if (Math.max(absX, absY) > 30) {
    let direction = -1;
    if (absX > absY) {
      direction = dx > 0 ? 1 : 3;
    } else {
      direction = dy > 0 ? 2 : 0;
    }
    if (game.move(direction)) {
      sound.playMove();
      render();
    }
  }
});

render();
</script>
</body>
</html>
