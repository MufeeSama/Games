<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成语接龙 - 竹简长卷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

        :root {
            --bamboo-bg: #e6c88b;
            --bamboo-border: #c8a361;
            --bamboo-dark: #8c6239;
            --ink: #2c1a0b;
            --red-stamp: #992222;
        }

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background-color: #f0e6d2;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
        }

        /* 游戏主画卷 */
        .scroll-container {
            background: linear-gradient(to bottom, #e2d1b3, #ebdfc8, #e2d1b3);
            box-shadow: inset 0 0 20px rgba(140, 98, 57, 0.2), 0 10px 30px rgba(0,0,0,0.1);
            border-left: 4px solid var(--bamboo-dark);
            border-right: 4px solid var(--bamboo-dark);
            width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* 隐藏滚动条但保留功能 */
        .scroll-container::-webkit-scrollbar { width: 8px; }
        .scroll-container::-webkit-scrollbar-track { background: transparent; }
        .scroll-container::-webkit-scrollbar-thumb { background: var(--bamboo-border); border-radius: 4px; }

        /* 单片竹简样式 */
        .bamboo-slip {
            min-height: 50px;
            width: 300px;
            background: linear-gradient(to bottom, #dec084, #e6c88b, #d4b473);
            border-top: 1px solid rgba(255,255,255,0.4);
            border-bottom: 2px solid var(--bamboo-border);
            margin: 2px 0;
            border-radius: 2px 4px 4px 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1), inset 0 0 10px rgba(140, 98, 57, 0.1);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: slipDrop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        /* 竹简顶部的穿绳孔 */
        .bamboo-slip::before, .bamboo-slip::after {
            content: '';
            position: absolute;
            width: 6px; height: 6px;
            background-color: var(--bamboo-dark);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
        }
        .bamboo-slip::before { left: 20px; top: 50%; transform: translateY(-50%); }
        .bamboo-slip::after { right: 20px; top: 50%; transform: translateY(-50%); }

        /* 竹简文字横排 */
        .slip-text {
            writing-mode: horizontal-tb;
            text-orientation: mixed;
            color: var(--ink);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
        }

        /* 首尾相接的高亮文字 */
        .highlight-char {
            color: var(--red-stamp);
            font-weight: 900;
        }

        @keyframes slipDrop {
            to { opacity: 1; transform: translateY(0); }
        }

        /* UI 控件 */
        .ancient-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--bamboo-dark);
            color: var(--ink);
            font-family: inherit;
        }
        .ancient-input:focus { outline: none; border-bottom-color: var(--red-stamp); }
        
        .ancient-btn {
            background-color: var(--bamboo-dark);
            color: #f0e6d2;
            border: 2px solid var(--bamboo-dark);
            transition: all 0.2s;
        }
        .ancient-btn:hover {
            background-color: transparent;
            color: var(--bamboo-dark);
        }

        /* 手机端适配 */
        @media (max-width: 640px) {
            body {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }

            .scroll-container {
                width: 100%;
                max-width: none;
                max-height: calc(100vh - 200px);
                padding: 12px 0;
            }

            .bamboo-slip {
                min-height: 44px;
                width: calc(100% - 20px);
                max-width: 280px;
            }

            .slip-text {
                font-size: 18px;
                letter-spacing: 3px;
            }

            .bamboo-slip::before { left: 12px; }
            .bamboo-slip::after { right: 12px; }

            /* 顶部状态栏调整 */
            .h-20 {
                height: auto;
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .h-20 h1 {
                font-size: 1.4rem;
                letter-spacing: 0.1em;
            }

            #timer-display {
                font-size: 1.8rem;
            }

            /* 底部操作区调整 */
            .h-24 {
                height: auto;
                padding: 12px;
                gap: 8px;
            }

            #last-char-hint {
                font-size: 0.9rem;
            }

            #idiom-input {
                font-size: 1.1rem;
                height: 44px;
            }

            #submit-btn {
                height: 44px;
                padding: 0 14px;
                font-size: 1rem;
            }

            /* 竹简连线调整 */
            .bamboo-line {
                display: none;
            }
        }
    </style>
</head>

            <a href="index.html" class="bg-[#8c6239] hover:bg-[#6b4a2b] text-[#f0e6d2] px-3 py-2 rounded-lg font-bold transition-all flex items-center gap-1 shadow-lg shrink-0">

    <!-- 游戏主画卷 (纵向滚动竹简) -->
    <div class="flex-1 flex flex-row justify-center relative gap-4">
        <!-- 竹简连线背景 -->
        <div class="bamboo-line absolute left-1/2 -ml-[135px] h-full border-l border-[var(--bamboo-dark)] opacity-20 pointer-events-none z-0"></div>
        <div class="bamboo-line absolute left-1/2 ml-[135px] h-full border-l border-[var(--bamboo-dark)] opacity-20 pointer-events-none z-0"></div>

        <div id="scroll-container" class="scroll-container z-10">
            <!-- 竹简通过JS动态插入 -->
        </div>
    </div>

    <!-- 底部操作区 -->
    <div class="h-24 shrink-0 bg-[#f0e6d2] border-t border-[#c8a361]/30 flex flex-col items-center justify-center relative z-10 px-4">
        <!-- 系统提示/状态 -->
        <div id="status-msg" class="absolute -top-10 text-[var(--red-stamp)] font-bold text-sm bg-[#f0e6d2] px-4 py-1 rounded-t-lg border border-b-0 border-[#c8a361]/30 opacity-0 transition-opacity whitespace-nowrap">
            提示信息
        </div>

        <div class="flex items-center gap-4 w-full max-w-md">
            <div class="text-[var(--ink)] font-bold whitespace-nowrap text-lg" id="last-char-hint">起手式：</div>
            <input type="text" id="idiom-input" 
                class="ancient-input flex-1 h-12 text-2xl px-2 text-center placeholder:text-[var(--bamboo-border)]"
                placeholder="输入任意成语开局"
                autocomplete="off" maxlength="8">
            <button id="submit-btn" class="ancient-btn h-12 px-6 rounded font-bold text-lg whitespace-nowrap">接龙</button>
        </div>
    </div>

    <!-- 结算模态框 -->
    <div id="modal" class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#f0e6d2] p-8 rounded border-4 border-[var(--bamboo-dark)] text-center max-w-sm w-[90%] transform scale-95 transition-transform duration-300" id="modal-content">
            <h2 id="modal-title" class="text-4xl font-black text-[var(--red-stamp)] mb-2">胜负已分</h2>
            <p id="modal-desc" class="text-[var(--ink)] mb-6 text-lg font-medium leading-relaxed">
                共接龙 <span id="round-count" class="text-2xl font-black text-[var(--red-stamp)]">0</span> 次
            </p>
            <button onclick="initGame()" class="ancient-btn w-full py-3 rounded text-xl font-bold">再战一局</button>
        </div>
    </div>

        const IDIOMS_DB = new Set(rawIdioms.split(','));
        const idiomMap = new Map();

        // 构建快速首字索引，方便AI极速接龙
        IDIOMS_DB.forEach(idiom => {
            const firstChar = idiom.charAt(0);
            if (!idiomMap.has(firstChar)) idiomMap.set(firstChar, []);
            idiomMap.get(firstChar).push(idiom);
        });

        // 状态变量
        let usedIdioms = new Set();
        let currentIdiom = "";
        let timer = null;
        let timeLeft = 60;
        let isPlayerTurn = true;
        let roundCount = 0;

        // DOM 元素
        const scrollContainer = document.getElementById('scroll-container');
        const inputEl = document.getElementById('idiom-input');
        const submitBtn = document.getElementById('submit-btn');
        const timerDisplay = document.getElementById('timer-display');
        const statusMsg = document.getElementById('status-msg');
        const lastCharHint = document.getElementById('last-char-hint');
        const modal = document.getElementById('modal');

        function showStatus(msg) {
            statusMsg.innerText = msg;
            statusMsg.classList.remove('opacity-0');
            statusMsg.style.transform = "translateY(-10px)";
            setTimeout(() => {
                statusMsg.classList.add('opacity-0');
                statusMsg.style.transform = "translateY(0)";
            }, 2500);
        }

        function createBambooSlip(text, isAI) {
            const slip = document.createElement('div');
            slip.className = 'bamboo-slip';
            
            // 将文字转换成一个个span，实现首尾高亮
            let htmlStr = '';
            for(let i=0; i<text.length; i++) {
                // 接龙的重合字给予红色印章高亮 (第一回合无前缀字时不飘红第一个字)
                if ((i === 0 && text.length > 0 && currentIdiom !== "") || 
                    (i === text.length - 1 && isAI && !isPlayerTurn)) {
                    htmlStr += `<span class="${i===0 ? 'highlight-char' : ''}">${text[i]}</span>`;
                } else {
                    htmlStr += `<span>${text[i]}</span>`;
                }
            }

            const slipText = document.createElement('div');
            slipText.className = 'slip-text';
            slipText.innerHTML = htmlStr;
            slip.appendChild(slipText);

            // 标注来源
            const author = document.createElement('div');
            author.className = 'absolute bottom-2 text-[10px] font-bold ' + (isAI ? 'text-[var(--bamboo-dark)]' : 'text-[var(--red-stamp)]');
            author.innerText = isAI ? "墨客" : "阁下";
            slip.appendChild(author);

            scrollContainer.appendChild(slip);
            
            // 自动向下平滑滚动
            setTimeout(() => {
                scrollContainer.scrollTo({
                    top: scrollContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 60;
            timerDisplay.innerText = timeLeft;
            timerDisplay.style.color = "var(--ink)";
            
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 10) timerDisplay.style.color = "var(--red-stamp)";
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endGame(false, "超时未出招，阁下遗憾落败。");
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timer);
        }

        function aiTurn() {
            isPlayerTurn = false;
            stopTimer();
            timerDisplay.innerText = "对方";
            inputEl.disabled = true;
            submitBtn.disabled = true;

            setTimeout(() => {
                const targetChar = currentIdiom.charAt(currentIdiom.length - 1);
                const candidates = idiomMap.get(targetChar) || [];
                
                // 筛选出未使用的成语
                const validCandidates = candidates.filter(id => !usedIdioms.has(id));

                if (validCandidates.length === 0) {
                    // AI 词穷
                    endGame(true, "对方词穷接不上，阁下才高八斗，大获全胜！");
                } else {
                    // AI 随机挑选一个
                    const picked = validCandidates[Math.floor(Math.random() * validCandidates.length)];
                    playIdiom(picked, true);
                    
                    // 轮转回玩家
                    isPlayerTurn = true;
                    inputEl.disabled = false;
                    submitBtn.disabled = false;
                    inputEl.focus();
                    startTimer();
                }
            }, 1000 + Math.random() * 1500); // 模拟思考 1-2.5s
        }

        function playIdiom(idiomText, isAI) {
            // 如果是第一回合（currentIdiom 为空），先不把 currentIdiom 赋值，传给 createBambooSlip 以免第一个字被标红
            const isFirstRound = (currentIdiom === "");
            
            createBambooSlip(idiomText, isAI);
            usedIdioms.add(idiomText);
            currentIdiom = idiomText; // 状态更新
            
            if (!isFirstRound || !isAI) roundCount++; // 玩家开启的第一回合不计入 AI 的接龙数，算作 1 次有效回合
            
            const lastChar = idiomText.charAt(idiomText.length - 1);
            lastCharHint.innerHTML = `请以 <span class="text-[var(--red-stamp)] font-black text-2xl">${lastChar}</span> 开头：`;
            inputEl.placeholder = `输入以“${lastChar}”开头的成语`;
        }

        function handlePlayerSubmit() {
            if (!isPlayerTurn) return;
            
            const text = inputEl.value.trim();
            if (!text) return;

            // 1. 验证长度 (通常成语是4字，这里为了兼容部分多字成语，只限制最小3字)
            if (text.length < 3) {
                showStatus("成语字数过短，请查证");
                return;
            }

            // 2. 验证接龙规则 (如果不是第一回合的话，需同字相接)
            if (currentIdiom !== "") {
                const requiredChar = currentIdiom.charAt(currentIdiom.length - 1);
                if (text.charAt(0) !== requiredChar) {
                    showStatus(`接龙失败，必须以「${requiredChar}」字开头！`);
                    return;
                }
            }

            // 3. 验证是否为真实成语 (如果在库里)
            if (!IDIOMS_DB.has(text)) {
                showStatus(`内嵌万条微缩词库暂未收录「${text}」，或是错别字，请换一个`);
                return;
            }

            // 4. 验证是否已使用
            if (usedIdioms.has(text)) {
                showStatus(`「${text}」刚刚已经用过啦，请换一个`);
                return;
            }

            // 验证通过
            stopTimer();
            inputEl.value = "";
            playIdiom(text, false);
            aiTurn();
        }

        function endGame(playerWon, reason) {
            stopTimer();
            document.getElementById('modal-title').innerText = playerWon ? "才高八斗" : "遗憾落败";
            document.getElementById('modal-title').style.color = playerWon ? "var(--red-stamp)" : "var(--bamboo-dark)";
            document.getElementById('modal-desc').innerHTML = `${reason}<br>此番共交锋 <span class="text-2xl font-black text-[var(--red-stamp)]">${roundCount}</span> 次`;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95');
            }, 10);
        }

        function initGame() {
            // 隐藏模态框
            modal.classList.add('opacity-0');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);

            // 重置状态
            usedIdioms.clear();
            scrollContainer.innerHTML = '';
            currentIdiom = "";
            roundCount = 0;
            inputEl.value = "";
            
            // 由玩家起手
            lastCharHint.innerHTML = `起手式：`;
            inputEl.placeholder = `输入任意成语开局`;
            
            isPlayerTurn = true;
            inputEl.disabled = false;
            submitBtn.disabled = false;
            startTimer();
        }

        // 事件监听
        submitBtn.addEventListener('click', handlePlayerSubmit);
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handlePlayerSubmit();
        });

        // 主题初始化
        function getThemeFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('theme');
        }
        const urlTheme = getThemeFromURL();
        const savedTheme = urlTheme || localStorage.getItem('game-theme') || 'cyberpunk';
        // 成语接龙保持古典风格，但应用主题色调
        if (savedTheme === 'modern-minimalist' || savedTheme === 'arctic-frost') {
            document.body.style.backgroundColor = '#f5f5f5';
        }

        // 启动游戏
        initGame();

    </script>
</body>
</html>
