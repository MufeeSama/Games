<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十滴水 - 经典复刻版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 主题定义 */
        [data-theme="cyberpunk"] {
            --bg: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0f172a 40%, #0a0a0f 100%);
            --primary: #00fff0;
            --liquid: #39ff14;
            --glass-border: rgba(0, 255, 240, 0.5);
            --glass-bg: rgba(0, 255, 240, 0.1);
        }
        [data-theme="ocean-depths"] {
            --bg: radial-gradient(circle at 50% 40%, #1a3a52 0%, #0d2137 40%, #0a1628 100%);
            --primary: #4dd0e1;
            --liquid: #29b6f6;
            --glass-border: rgba(77, 208, 225, 0.5);
            --glass-bg: rgba(77, 208, 225, 0.1);
        }
        [data-theme="sunset-boulevard"] {
            --bg: radial-gradient(circle at 50% 40%, #2d1b2e 0%, #1a1a2e 40%, #16213e 100%);
            --primary: #ff6b6b;
            --liquid: #feca57;
            --glass-border: rgba(255, 107, 107, 0.5);
            --glass-bg: rgba(255, 107, 107, 0.1);
        }
        [data-theme="forest-canopy"] {
            --bg: radial-gradient(circle at 50% 40%, #2d4a2b 0%, #1e3d1e 40%, #1a2f1a 100%);
            --primary: #81c784;
            --liquid: #a5d6a7;
            --glass-border: rgba(129, 199, 132, 0.5);
            --glass-bg: rgba(129, 199, 132, 0.1);
        }
        [data-theme="modern-minimalist"] {
            --bg: radial-gradient(circle at 50% 40%, #f8f9fa 0%, #e9ecef 40%, #dee2e6 100%);
            --primary: #212529;
            --liquid: #495057;
            --glass-border: rgba(33, 37, 41, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.8);
        }
        [data-theme="golden-hour"] {
            --bg: radial-gradient(circle at 50% 40%, #3d3020 0%, #2a2015 40%, #2c2416 100%);
            --primary: #d4af37;
            --liquid: #f4e4c1;
            --glass-border: rgba(212, 175, 55, 0.5);
            --glass-bg: rgba(212, 175, 55, 0.1);
        }
        [data-theme="arctic-frost"] {
            --bg: radial-gradient(circle at 50% 40%, #e3f2fd 0%, #bbdefb 40%, #e1f5fe 100%);
            --primary: #1976d2;
            --liquid: #42a5f5;
            --glass-border: rgba(25, 118, 210, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.9);
        }
        [data-theme="desert-rose"] {
            --bg: radial-gradient(circle at 50% 40%, #3d282e 0%, #2d1f24 40%, #2d1f24 100%);
            --primary: #e8b4b8;
            --liquid: #f5e6e8;
            --glass-border: rgba(232, 180, 184, 0.5);
            --glass-bg: rgba(232, 180, 184, 0.1);
        }
        [data-theme="tech-innovation"] {
            --bg: radial-gradient(circle at 50% 40%, #21262d 0%, #161b22 40%, #0d1117 100%);
            --primary: #58a6ff;
            --liquid: #79c0ff;
            --glass-border: rgba(88, 166, 255, 0.5);
            --glass-bg: rgba(88, 166, 255, 0.1);
        }
        [data-theme="botanical-garden"] {
            --bg: radial-gradient(circle at 50% 40%, #2e7d32 0%, #1b5e20 40%, #1b5e20 100%);
            --primary: #ffeb3b;
            --liquid: #c8e6c9;
            --glass-border: rgba(255, 235, 59, 0.5);
            --glass-bg: rgba(255, 235, 59, 0.1);
        }
        [data-theme="midnight-galaxy"] {
            --bg: radial-gradient(circle at 50% 40%, #302b63 0%, #24243e 40%, #0f0c29 100%);
            --primary: #b39ddb;
            --liquid: #e1bee7;
            --glass-border: rgba(179, 157, 219, 0.5);
            --glass-bg: rgba(179, 157, 219, 0.1);
        }

        body {
            background: var(--bg);
            transition: all 0.5s ease;
        }
        /* 取消Canvas的点击高亮和默认交互 */
        canvas {
            -webkit-tap-highlight-color: transparent;
            touch-action: none; 
        }
        /* 玻璃烧瓶特效 */
        .glass-beaker {
            box-shadow: inset 0 -10px 30px rgba(255,255,255,0.4), 0 0 20px var(--glass-border);
            border-color: var(--glass-border) !important;
            background: var(--glass-bg) !important;
        }
        .game-board {
            border-color: var(--glass-border) !important;
            background: var(--glass-bg) !important;
        }
        .liquid {
            background: var(--liquid) !important;
        }

        /* 返回首页按钮 */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: var(--glass-bg);
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-primary);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 静音按钮 */
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--glass-bg);
            border: none;
            border-radius: 12px;
            padding: 10px;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            width: 44px;
            height: 44px;
        }

        .sound-toggle:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-primary);
        }

        .sound-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* 手机端适配 */
        @media (max-width: 768px) {
            body {
                overflow-y: auto !important;
                padding: 16px;
                gap: 16px;
            }

            .back-btn {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                align-self: flex-start;
                padding: 8px 14px;
                font-size: 12px;
                order: -1;
            }

            .sound-toggle {
                position: relative;
                top: auto;
                right: auto;
                width: 40px;
                height: 40px;
                padding: 8px;
                order: -1;
            }

            .game-board {
                max-width: 90vw !important;
            }
        }
    </style>
</head>
<body data-theme="cyberpunk" class="min-h-screen flex flex-col md:flex-row items-center justify-center gap-12 p-4 font-sans text-slate-800 overflow-hidden">

    <!-- 返回首页按钮 -->
    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        返回
    </a>

    <!-- 静音切换按钮 -->
    <button id="soundToggle" class="sound-toggle" title="切换音效">
        <svg id="iconSoundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <svg id="iconSoundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>

    <!-- 游戏主区域 (玻璃质感网格) -->
    <div class="relative w-full max-w-[480px] aspect-square game-board rounded-xl shadow-2xl overflow-hidden border-[8px] border-[#e0f6ff] backdrop-blur-sm">
        <canvas id="gameCanvas" width="480" height="480" class="w-full h-full cursor-pointer"></canvas>

        <!-- 模态框 (通关/游戏结束提示) -->
        <div id="modal" class="absolute inset-0 bg-slate-900/60 backdrop-blur-[4px] flex items-center justify-center z-10 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white p-8 rounded-2xl shadow-2xl text-center transform scale-95 transition-transform duration-300 w-[80%] max-w-xs" id="modalContent">
                <h2 id="modalTitle" class="text-3xl font-black text-slate-800 mb-2">过关！</h2>
                <p id="modalDesc" class="text-slate-500 mb-6 text-sm font-medium">额外奖励 1 滴水</p>
                <button id="modalBtn" class="w-full bg-[#39ff14] hover:bg-green-500 active:scale-95 text-slate-900 font-black py-3 px-6 rounded-xl transition-all shadow-lg shadow-green-500/30">
                    下一关
                </button>
            </div>
        </div>
    </div>

    <!-- 侧边 UI (取代原有顶部 HUD) -->
    <div class="flex flex-col items-center justify-center relative z-10 w-48 shrink-0">
        <!-- 玻璃烧瓶容积 -->
        <div class="relative w-40 h-40 rounded-full border-[6px] border-white/70 bg-white/10 overflow-hidden glass-beaker flex items-center justify-center shadow-2xl">
            <!-- 内部液面 -->
            <div id="liquidLevel" class="liquid absolute bottom-0 w-full h-[60%] bg-[#39ff14] transition-all duration-500" style="box-shadow: inset 0 10px 20px rgba(255,255,255,0.5);"></div>
            <!-- 高光 -->
            <div class="absolute top-2 left-4 w-12 h-6 bg-white/60 rounded-full rotate-[-30deg] blur-[2px]"></div>
            <!-- 数值 (黑边黑影增加对比) -->
            <span id="dropsDisplay" class="relative z-10 text-7xl font-black text-white" style="text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);">10</span>
        </div>
        <!-- 关卡数 -->
        <div class="mt-6 text-center w-full">
            <div class="text-2xl text-white font-bold tracking-wider shadow-sm mb-0">level</div>
            <div id="levelDisplay" class="text-7xl font-black text-white" style="text-shadow: 0px 4px 8px rgba(0,0,0,0.6);">1</div>
        </div>
    </div>

    <script>
        // ==================== 音效引擎 ====================
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.volume = 0.4;
                this.initAudio();
            }

            initAudio() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API not supported');
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            _playOsc(type, frequency, duration, fadeOut = 0.02) {
                if (!this.enabled || !this.ctx) return;
                this.resume();
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, t);
                gain.gain.setValueAtTime(this.volume, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + duration + fadeOut);
            }

            _playNoise(duration) {
                if (!this.enabled || !this.ctx) return;
                this.resume();
                const t = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(this.volume * 0.6, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                noise.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(t);
            }

            // 1. 滴答声：放置水滴
            playDrop() {
                this._playOsc('sine', 1200, 0.06);
                setTimeout(() => this._playOsc('sine', 600, 0.04), 30);
            }

            // 2. 咕咚声：碰撞合并
            playMerge() {
                this._playOsc('sine', 350, 0.12);
                setTimeout(() => this._playOsc('sine', 250, 0.1), 40);
            }

            // 3. 啪声：爆裂
            playBurst() {
                this._playNoise(0.1);
                this._playOsc('triangle', 200, 0.08);
            }

            // 4. 连锁递进：音高随连锁次数递增
            playChain(level) {
                const baseFreq = 440 + Math.min(level, 8) * 110;
                this._playOsc('sine', baseFreq, 0.08);
                setTimeout(() => this._playOsc('sine', baseFreq * 1.25, 0.06), 50);
            }

            // 5. 胜利音效：上行音阶
            playWin() {
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    setTimeout(() => this._playOsc('sine', freq, 0.2), i * 100);
                });
            }

            // 6. 失败音效：下行低音
            playLose() {
                const notes = [300, 250, 200, 150];
                notes.forEach((freq, i) => {
                    setTimeout(() => this._playOsc('triangle', freq, 0.4), i * 150);
                });
            }

            // 7. 叮声：奖励
            playReward() {
                const t = this.ctx ? this.ctx.currentTime : 0;
                [1760, 2217].forEach((freq, i) => {
                    setTimeout(() => {
                        if (!this.enabled || !this.ctx) return;
                        this.resume();
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(this.volume * 0.5, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime);
                        osc.stop(this.ctx.currentTime + 0.35);
                    }, i * 60);
                });
            }

            toggle() {
                this.enabled = !this.enabled;
                return this.enabled;
            }
        }

        const sound = new SoundEngine();

        // 静音按钮事件
        document.getElementById('soundToggle').addEventListener('click', () => {
            const on = sound.toggle();
            document.getElementById('iconSoundOn').style.display = on ? 'block' : 'none';
            document.getElementById('iconSoundOff').style.display = on ? 'none' : 'block';
        });

        // 主题初始化
        function getThemeFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('theme');
        }
        const urlTheme = getThemeFromURL();
        const savedTheme = urlTheme || localStorage.getItem('game-theme') || 'cyberpunk';
        document.body.setAttribute('data-theme', savedTheme);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏常量配置
        const COLS = 6;
        const ROWS = 6;
        const CELL_SIZE = 80; // 480 / 6
        const SPEED = 8;      // 飞溅水珠的速度 (必须能被CELL_SIZE整除)

        // 游戏状态变量
        let grid = [];
        let bullets = [];
        let burstQueue = [];
        let floatingTexts = [];

        let level = 1;
        let dropsLeft = 10;
        let burstCount = 0;      // 当前回合连爆数
        let isAnimating = false; // 是否在播放连锁反应动画
        let gameState = 'playing'; // playing, modal

        // 初始化关卡
        function initLevel() {
            grid = Array(COLS).fill().map(() => Array(ROWS).fill(0));
            bullets = [];
            burstQueue = [];
            floatingTexts = [];
            isAnimating = false;
            burstCount = 0;
            gameState = 'playing';

            // 根据经典规则并减少20%：第一关有约28个水滴，每升一级减少1个水滴。
            const maxDrops = Math.floor(COLS * ROWS * 0.8); // 36 * 0.8 = 28
            const dropsToPlace = Math.max(1, maxDrops - (level - 1));

            // 创建所有网格坐标并随机打乱，用于随机分配空缺位置
            let positions = [];
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    positions.push({c, r});
                }
            }
            positions.sort(() => Math.random() - 0.5);

            // 在打乱后的坐标中放置指定数量的水滴
            for(let i = 0; i < dropsToPlace; i++) {
                let pos = positions[i];
                grid[pos.c][pos.r] = Math.floor(Math.random() * 4) + 1; // 生成 1~4 级的水滴
            }
            
            updateHUD();
        }

        // 更新UI数值
        function updateHUD() {
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('dropsDisplay').innerText = dropsLeft;
            
            // 更新烧瓶液面高度，最高100%，以20滴为满参考
            let heightPercent = Math.min(100, (dropsLeft / 20) * 100);
            if(dropsLeft > 0 && heightPercent < 15) heightPercent = 15; // 至少显示一点点，除非用光
            if(dropsLeft === 0) heightPercent = 0;
            document.getElementById('liquidLevel').style.height = `${heightPercent}%`;
        }

        // 绘制画面
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景网格 (玻璃方块质感)
            ctx.lineWidth = 4;
            for(let c = 0; c < COLS; c++) {
                for(let r = 0; r < ROWS; r++) {
                    let x = c * CELL_SIZE;
                    let y = r * CELL_SIZE;
                    
                    // 玻璃方块底色
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.beginPath();
                    ctx.roundRect(x + 4, y + 4, CELL_SIZE - 8, CELL_SIZE - 8, 12);
                    ctx.fill();
                    
                    // 玻璃方块边框
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.stroke();

                    // 添加内侧阴影增强立体感
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.beginPath();
                    ctx.roundRect(x + 6, y + 6, CELL_SIZE - 12, CELL_SIZE - 12, 10);
                    ctx.stroke();
                }
            }

            // 绘制网格中的水滴 (绿色史莱姆质感)
            const time = Date.now() / 150; // 用于实现轻微呼吸起伏的动画效果
            for(let c = 0; c < COLS; c++) {
                for(let r = 0; r < ROWS; r++) {
                    let size = grid[c][r];
                    if (size > 0 && size <= 4) {
                        let cx = c * CELL_SIZE + CELL_SIZE / 2;
                        let cy = r * CELL_SIZE + CELL_SIZE / 2;
                        let wobble = Math.sin(time + c*ROWS + r) * 1.5;

                        ctx.save();
                        ctx.translate(cx, cy);

                        // 绿色玻璃质感渐变效果
                        let grad = ctx.createRadialGradient(-6, -6, 2, 0, 0, 35);
                        grad.addColorStop(0, '#dcfce7');     // 顶部极亮高光透射
                        grad.addColorStop(0.3, '#39ff14');   // 主体明亮荧光绿
                        grad.addColorStop(0.7, '#16a34a');   // 中层过渡暗绿
                        grad.addColorStop(1, '#064e3b');     // 边缘/底部深邃暗绿

                        // 添加水滴外阴影增加立体感
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                        ctx.shadowBlur = 6;
                        ctx.shadowOffsetY = 3;

                        ctx.fillStyle = grad;

                        ctx.beginPath();
                        if (size === 1) {
                            // 极小圆
                            ctx.arc(0, 0, 10 + wobble, 0, Math.PI*2);
                        } else if (size === 2) {
                            // 稍大，不规则豆子形
                            ctx.ellipse(2, 2, 16 + wobble, 14 + wobble, 0, 0, Math.PI*2);
                            ctx.arc(-8, -6, 8 + wobble, 0, Math.PI*2);
                        } else if (size === 3) {
                            // 不规则三角/阿米巴形状
                            ctx.moveTo(0, -20 - wobble);
                            ctx.bezierCurveTo(28, -15, 22, 18, 0, 20 + wobble);
                            ctx.bezierCurveTo(-22, 18, -28, -15, 0, -20 - wobble);
                        } else if (size === 4) {
                            // 饱满大圆，即将爆裂
                            ctx.arc(0, 0, 30 + wobble, 0, Math.PI*2);
                        }
                        ctx.fill();

                        // 关闭阴影以免影响高光和内反射绘制
                        ctx.shadowColor = 'transparent';

                        // 绘制玻璃质感的内反射 (底部微弱亮光，增强通透感)
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        if (size === 1) {
                            ctx.arc(0, 0, 8 + wobble, Math.PI*0.1, Math.PI*0.8);
                        } else if (size === 4) {
                            ctx.arc(0, 0, 26 + wobble, Math.PI*0.1, Math.PI*0.8);
                        }
                        ctx.stroke();

                        // 绘制强烈的白色反光高光 (锋利的玻璃光泽感)
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                        ctx.beginPath();
                        if (size === 1) {
                            ctx.arc(-3, -3, 3, 0, Math.PI*2);
                        } else if (size === 2) {
                            ctx.ellipse(-6, -6, 5, 2, Math.PI/4, 0, Math.PI*2);
                        } else if (size === 3) {
                            ctx.ellipse(-8, -8, 7, 3, Math.PI/4, 0, Math.PI*2);
                        } else if (size === 4) {
                            ctx.ellipse(-12, -12, 10, 5, Math.PI/4, 0, Math.PI*2);
                            // 次要高光点
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.beginPath();
                            ctx.arc(14, 14, 4, 0, Math.PI*2);
                        }
                        ctx.fill();

                        ctx.restore();
                    }
                }
            }

            // 绘制飞溅的水珠（子弹）
            for(let b of bullets) {
                ctx.save();
                // 子弹阴影
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetY = 2;
                
                // 子弹主体 (绿色玻璃质感)
                let bGrad = ctx.createRadialGradient(b.cx - 2, b.cy - 2, 0, b.cx, b.cy, 7);
                bGrad.addColorStop(0, '#dcfce7');
                bGrad.addColorStop(0.4, '#39ff14');
                bGrad.addColorStop(1, '#064e3b');
                ctx.fillStyle = bGrad;
                
                ctx.beginPath();
                ctx.arc(b.cx, b.cy, 7, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
                
                // 子弹高光
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath();
                ctx.arc(b.cx - 2, b.cy - 2, 2.5, 0, Math.PI*2);
                ctx.fill();
            }

            // 绘制浮动文字 (如: +1)
            for(let ft of floatingTexts) {
                ctx.fillStyle = `rgba(255, 255, 255, ${ft.alpha})`; // 白色字
                ctx.font = '900 24px system-ui, sans-serif';
                ctx.textAlign = 'center';
                // 黑色描边让字更清晰
                ctx.strokeStyle = `rgba(0, 0, 0, ${ft.alpha})`;
                ctx.lineWidth = 3;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillText(ft.text, ft.x, ft.y);
            }
        }

        // 更新游戏逻辑 (移动、碰撞、连锁反应)
        function update() {
            if (gameState !== 'playing') return;

            let currentlyAnimating = false;

            // 1. 移动所有飞溅水珠并检测碰撞
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.cx += b.vx;
                b.cy += b.vy;

                // 离开屏幕，标记为销毁
                if (b.cx < 0 || b.cx > canvas.width || b.cy < 0 || b.cy > canvas.height) {
                    b.dead = true;
                    continue;
                }

                // 碰撞检测逻辑：当水珠到达某个网格中心时判断
                let c = Math.floor(b.cx / CELL_SIZE);
                let r = Math.floor(b.cy / CELL_SIZE);
                let center_x = c * CELL_SIZE + CELL_SIZE / 2;
                let center_y = r * CELL_SIZE + CELL_SIZE / 2;

                if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
                    if (grid[c][r] > 0) {
                        // 如果距离网格中心非常近（使用速度的一半来容错）
                        if (Math.abs(b.cx - center_x) <= Math.abs(b.vx)/2 && Math.abs(b.cy - center_y) <= Math.abs(b.vy)/2) {
                            if (grid[c][r] < 5) {
                                const oldSize = grid[c][r];
                                grid[c][r]++;
                                // 音效：碰撞合并（非爆裂时）
                                if (grid[c][r] < 5) {
                                    sound.playMerge();
                                }
                                // 达到5级，加入爆裂队列
                                if (grid[c][r] === 5) {
                                    burstQueue.push({c, r});
                                }
                            }
                            b.dead = true; // 击中目标后水珠消失
                        }
                    }
                }
            }

            // 移除被标记为销毁的水珠
            bullets = bullets.filter(b => !b.dead);

            // 2. 处理爆裂队列
            if (burstQueue.length > 0) {
                for(let b of burstQueue) {
                    grid[b.c][b.r] = 0; // 清空当前网格
                    let cx = b.c * CELL_SIZE + CELL_SIZE / 2;
                    let cy = b.r * CELL_SIZE + CELL_SIZE / 2;
                    
                    // 向上下左右发射4颗水珠
                    bullets.push({cx, cy, vx: SPEED, vy: 0});
                    bullets.push({cx, cy, vx: -SPEED, vy: 0});
                    bullets.push({cx, cy, vx: 0, vy: SPEED});
                    bullets.push({cx, cy, vx: 0, vy: -SPEED});

                    burstCount++;
                    // 音效：爆裂 + 连锁递进
                    sound.playBurst();
                    sound.playChain(burstCount);

                    // 游戏核心规则：连爆奖励。从连锁反应的第3个爆裂开始，每一个爆裂额外奖励1滴水。
                    if (burstCount >= 3) {
                        dropsLeft++;
                        floatingTexts.push({
                            text: '+1',
                            x: cx,
                            y: cy - 10,
                            alpha: 1.0,
                            life: 60
                        });
                        // 音效：奖励
                        sound.playReward();
                        updateHUD();
                    }
                }
                burstQueue = [];
            }

            // 3. 更新浮动文字状态
            for(let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 0.8; // 向上飘动
                ft.life--;
                ft.alpha = ft.life / 60; // 渐隐
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // 4. 检查游戏动画状态与输赢判定
            currentlyAnimating = bullets.length > 0 || burstQueue.length > 0;

            // 如果刚刚结束所有动画，且水珠平息
            if (isAnimating && !currentlyAnimating) {
                checkWinLoss();
            }
            isAnimating = currentlyAnimating;
        }

        // 胜负条件判定
        function checkWinLoss() {
            let allEmpty = true;
            for(let c = 0; c < COLS; c++) {
                for(let r = 0; r < ROWS; r++) {
                    if (grid[c][r] > 0) allEmpty = false;
                }
            }

            if (allEmpty) {
                gameState = 'modal';
                level++;
                // 游戏核心规则：通关后奖励一滴水
                dropsLeft++; 
                sound.playWin();
                showModal('通关！', '恭喜清除所有水滴，奖励 1 滴水。', '进入下一关', () => {
                    initLevel();
                });
            } else if (dropsLeft <= 0) {
                gameState = 'modal';
                sound.playLose();
                showModal('水滴用尽', `遗憾，您止步于第 ${level} 关`, '重新开始', () => {
                    level = 1;
                    dropsLeft = 10;
                    initLevel();
                });
            }
        }

        // --- 模态框 UI 逻辑 ---
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalBtn = document.getElementById('modalBtn');
        let modalAction = null;

        function showModal(title, desc, btnText, action) {
            modalTitle.innerText = title;
            modalDesc.innerText = desc;
            modalBtn.innerText = btnText;
            modalAction = action;

            modal.classList.remove('hidden');
            // 小延迟以确保过渡动画生效
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        modalBtn.addEventListener('click', () => {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (modalAction) modalAction();
            }, 300); // 等待 Tailwind 的 duration-300 执行完毕
        });

        // --- 鼠标/触摸交互事件 ---
        function handleInput(clientX, clientY) {
            if (isAnimating || gameState !== 'playing') return;
            if (dropsLeft <= 0) return;

            const rect = canvas.getBoundingClientRect();
            // 计算屏幕缩放比例，保证无论 Canvas 在屏幕上多大，计算逻辑都是准的
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const c = Math.floor(x / CELL_SIZE);
            const r = Math.floor(y / CELL_SIZE);

            if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
                // 消耗一滴库存
                dropsLeft--;
                burstCount = 0; // 玩家每次主动点击时，重置连击计数器
                grid[c][r]++;
                
                // 音效：放置水滴
                sound.playDrop();

                // 如果到达5级立刻加入爆裂队列
                if (grid[c][r] >= 5) {
                    burstQueue.push({c, r});
                }
                updateHUD();

                // 强制触发一次动画状态更新
                isAnimating = true;
            }
        }

        canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 阻止默认的滚动或缩放
            if(e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        // 主游戏循环
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 启动游戏
        initLevel();
        loop();
    </script>
</body>
</html>
